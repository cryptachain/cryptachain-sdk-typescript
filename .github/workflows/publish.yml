name: Publish to npm

# Publishes @cryptachain/sdk to npm via OIDC Trusted Publishing.
# Manual only: run "Publish to npm" (workflow_dispatch) with the release tag, e.g. v0.1.1.
# Creating a GitHub release does NOT publish.
# Requires: Trusted Publisher configured on npmjs.com for this package,
# pointing at cryptachain/cryptachain-sdk-typescript + workflow file "publish.yml" (no environment).
# npm cannot configure a Trusted Publisher for a package that does not exist yet, so the very
# first version is published once from a maintainer machine. No NPM_TOKEN or other long-lived
# secret is used here.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (must equal v<package.json version>), e.g. v0.1.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Check tag equals package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag '$TAG' does not match package.json version 'v$VERSION'" >&2
            exit 1
          fi
          echo "OK: $TAG == v$VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (OIDC trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm (OIDC)
        run: npm publish --provenance --access public
